name: Publicar capítulos agendados

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Liberar capítulos que chegaram ao horário
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://meu-manga.vercel.app/api/cron/publish
