name: Qualidade

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: manga
          POSTGRES_PASSWORD: manga
          POSTGRES_DB: manga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manga -d manga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://manga:manga@localhost:5432/manga_test
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      SITE_NAME: Meu Mangá CI
      ADMIN_EMAIL: admin-ci@example.com
      E2E_ADMIN_EMAIL: admin-ci@example.com
      ADMIN_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run build
      - name: Iniciar aplicação
        run: |
          npm start > /tmp/manga-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/manga-next.log
          exit 1
      - run: npm run test:audit
      - run: npm run test:e2e
      - name: Logs do servidor
        if: failure()
        run: cat /tmp/manga-next.log
